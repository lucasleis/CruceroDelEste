name: Tests

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Credenciales de MercadoPago/Resend/etc. son dummies inconfundibles,
      # NO secrets — no hay nada real detrás. La lista completa vive en
      # backend/pyproject.toml ([tool.pytest.ini_options] env) y es la
      # única fuente de verdad; no se duplica acá para no divergir en
      # silencio. TEST_DATABASE_URL es la única variable que pytest-env
      # no pisa (no está en esa lista), así que es la única que hace
      # falta declarar acá para apuntar al servicio de Postgres del job.
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies (uv sync — usa uv.lock, no resuelve fresco)
        working-directory: backend
        run: uv sync --locked --extra dev

      - name: Run pytest
        working-directory: backend
        run: uv run pytest

  alembic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_USER: alembic
          POSTGRES_PASSWORD: alembic
          POSTGRES_DB: alembic_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # DATABASE_URL: lo que usa Alembic para conectarse (async driver requerido
      # por env.py, que usa async_engine_from_config).
      DATABASE_URL: postgresql+asyncpg://alembic:alembic@localhost:5432/alembic_check
      # Las 8 variables requeridas por Settings — dummies inconfundibles,
      # sin nada real detrás. Alembic no las usa; son necesarias porque
      # app.database importa app.config.settings a nivel de módulo, y
      # Settings() lanza ValidationError si faltan.
      SYNC_DATABASE_URL: postgresql://alembic:alembic@localhost:5432/alembic_check
      SECRET_KEY: "00000000000000000000000000000000"
      MERCADOPAGO_ACCESS_TOKEN: "TEST-alembic-ci-dummy"
      MERCADOPAGO_WEBHOOK_SECRET: "alembic-ci-dummy"
      RESEND_API_KEY: "re_alembic_ci_dummy"
      FRONTEND_URL: "http://localhost:3000"
      BACKEND_URL: "http://localhost:8000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked --extra dev

      - name: Apply migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Verificar que las migraciones se aplicaron
        working-directory: backend
        run: |
          COUNT=$(PGPASSWORD=alembic psql -h localhost -U alembic \
            -d alembic_check -tAc \
            "SELECT count(*) FROM information_schema.tables \
             WHERE table_schema='public'")
          echo "Tablas en public: $COUNT"
          if [ "$COUNT" -lt 14 ]; then
            echo "ERROR: se esperaban al menos 14 tablas (+ alembic_version)."
            echo "El upgrade no se aplicó a la base que el check va a mirar."
            exit 1
          fi

      - name: Check for schema drift
        working-directory: backend
        run: uv run alembic check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run vitest
        working-directory: frontend
        run: npx vitest run

  frontend-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-admin/package-lock.json

      - name: Install dependencies
        working-directory: frontend-admin
        run: npm ci

      - name: Run vitest
        working-directory: frontend-admin
        run: npx vitest run
